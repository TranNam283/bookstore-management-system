spring.application.name=backend

# Giá trị lấy từ biến môi trường (Docker / Render).
# Khi chạy local: tạo file backend/.env.local (đã gitignore) để ghi đè, ví dụ DATASOURCE_PASSWORD=...
spring.config.import=optional:file:.env.local[.properties]

server.port=${SERVER_PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/bookstore_dev?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Nạp quan hệ lazy theo lô khi đọc danh sách vào cache (giảm số câu SELECT)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

momo.partnercode=${MOMO_PARTNERCODE}
momo.accesskey=${MOMO_ACCESSKEY}
momo.secretkey=${MOMO_SECRETKEY}
momo.url=${MOMO_URL}
momo.ipn-url=${BACKEND_URL:http://localhost:8080}/api/payment/momo/redirect
momo.redirect-url=${BACKEND_URL:http://localhost:8080}/api/payment/momo/redirect
momo.refund-url=${MOMO_REFUND_URL}

# Thời gian một phiên cache dữ liệu trên RAM (phút)
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:15}
